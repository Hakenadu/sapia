<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sapia</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090b10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Sapia – a modern editor for text-based diagrams." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Applies the stored theme before first paint. A file, not inline, so a strict CSP can be used. -->
    <script src="theme-init.js"></script>
  </head>
  <body>
    <sapia-root></sapia-root>
  </body>
</html>
